[package]
edition.workspace = true
name = "koe-ffi"
version.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
thiserror = { workspace = true }
uniffi = { workspace = true, features = ["cli"] }
workspace-hack.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true }
dispatch2 = { workspace = true }
koe-capture = { workspace = true }
koe-transcribe = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSResponder",
  "NSRunningApplication",
  "NSWorkspace",
  "libc",
] }
objc2-av-foundation = { workspace = true, features = [
  "AVCaptureDevice",
  "AVMediaFormat",
  "block2",
] }
objc2-core-media = { workspace = true, features = ["CMTime"] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSEnumerator",
  "NSError",
  "NSString",
  "block2",
] }
objc2-screen-capture-kit = { workspace = true, features = [
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "libc",
  "objc2-core-media",
] }

[lints]
workspace = true
