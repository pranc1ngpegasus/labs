[workspace]
members = [
  "koe/koe-cli",
  "koe/koe-core",
  "koe/koe-ffi",
  "ren/ren",
  "ren/ren-memory",
  "ren/ren-workflow",
  "sui/sui",
  "sui/sui-agent",
  "sui/sui-app",
  "sui/sui-llm",
  "sui/sui-theme",
  "sui/sui-tools",
  "sui/sui-widget",
  "sui/sui-workflow",
]
resolver = "3"

[workspace.dependencies]
block2 = "0.6.2"
clap = "4.6.6"
codewandler-markdown = "0.2.1"
codewandler-markdown-ratatui = "0.2.1"
color-eyre = "0.6.5"
crossterm = "0.29.0"
dispatch2 = "0.3.1"
flacenc = { version = "0.5.1", default-features = false }
fs2 = "0.4.3"
futures = "0.3.34"
gitpatch = "0.7.1"
ignore = "0.4.23"
jiff = "0.2.18"
koe-cli = { path = "koe/koe-cli" }
koe-core = { path = "koe/koe-core" }
koe-ffi = { path = "koe/koe-ffi" }
log = "0.4.33"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-av-foundation = { version = "0.3.2", default-features = false }
objc2-avf-audio = { version = "0.3.2", default-features = false }
objc2-core-media = { version = "0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false }
objc2-speech = { version = "0.3.2", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
regex = "1.13.1"
ren-memory = { path = "./ren/ren-memory" }
ren-workflow = { path = "./ren/ren-workflow" }
reqwest = { version = "0.13.4", default-features = false }
rhai = "1.23.6"
rusqlite = "0.40.1"
rustix = "1.1.4"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.11.0"
sui-agent = { path = "./sui/sui-agent" }
sui-app = { path = "./sui/sui-app" }
sui-llm = { path = "./sui/sui-llm" }
sui-theme = { path = "./sui/sui-theme" }
sui-tools = { path = "./sui/sui-tools" }
sui-widget = { path = "./sui/sui-widget" }
sui-workflow = { path = "./sui/sui-workflow" }
symphonia = { version = "0.6.1", default-features = false }
tantivy = "0.26.1"
thiserror = "2.0.20"
tokio = "1.53.1"
toml = "1.1.4"
toml_edit = "0.25.13"
ulid = "3.0.0"
unicode-width = "0.2.2"
uniffi = "0.32.0"
vorbis_rs = "0.5.6"
wiremock = "0.6.5"
yaml_serde = "0.10.4"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
