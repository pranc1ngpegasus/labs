[workspace]
members = [
  "sui/sui",
  "sui/sui-agent",
  "sui/sui-app",
  "sui/sui-llm",
  "sui/sui-theme",
  "sui/sui-tools",
  "sui/sui-widget",
  "sui/sui-workflow",
]
resolver = "3"

[workspace.dependencies]
codewandler-markdown = "0.2.1"
codewandler-markdown-ratatui = "0.2.1"
color-eyre = "0.6.5"
crossterm = "0.29.0"
futures = "0.3.34"
gitpatch = "0.7.1"
ratatui = { version = "0.30.2", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false }
rhai = "1.23.6"
serde = "1.0.228"
serde_json = "1.0.149"
sha2 = "0.11.0"
sui-agent = { path = "./sui/sui-agent" }
sui-app = { path = "./sui/sui-app" }
sui-llm = { path = "./sui/sui-llm" }
sui-theme = { path = "./sui/sui-theme" }
sui-tools = { path = "./sui/sui-tools" }
sui-widget = { path = "./sui/sui-widget" }
sui-workflow = { path = "./sui/sui-workflow" }
tantivy = "0.26.1"
thiserror = "2.0.20"
tokio = "1.53.1"
toml = "0.8"
unicode-width = "0.2.2"
wiremock = "0.6.5"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
nursery = "deny"
panic = "deny"
pedantic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.lints.rust]
future_incompatible = "deny"
unsafe_code = "deny"
unused = "deny"

[workspace.package]
edition = "2024"
version = "0.0.0"
