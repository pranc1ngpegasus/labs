[package]
edition.workspace = true
name = "oto-capture"
version.workspace = true

# Platform backends are selected per target so the `windows` crate and other
# unused backends never enter the build on other platforms (see design 05).
[target.'cfg(target_os = "macos")'.dependencies]
shiguredo_audio_device = { workspace = true, default-features = false, features = [
  "coreaudio",
  "default-coreaudio",
] }

# ScreenCaptureKit system-audio loopback (macOS 13+), Rust-only FFI via objc2.
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "NSApplication",
  "NSResponder",
  "NSRunningApplication",
  "libc",
] }
objc2-core-media = { workspace = true, features = ["CMTime"] }
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSError",
  "NSString",
  "block2",
] }
objc2-screen-capture-kit = { workspace = true, features = [
  "SCShareableContent",
  "SCStream",
  "block2",
  "dispatch2",
  "libc",
  "objc2-core-media",
] }

[target.'cfg(target_os = "linux")'.dependencies]
shiguredo_audio_device = { workspace = true, default-features = false, features = [
  "default-pulse",
  "pulse",
] }

[target.'cfg(target_os = "windows")'.dependencies]
shiguredo_audio_device = { workspace = true, default-features = false, features = [
  "default-wasapi",
  "wasapi",
] }

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
workspace-hack = { workspace = true }

[lints]
workspace = true
